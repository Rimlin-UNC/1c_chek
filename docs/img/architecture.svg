<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Segoe UI, Arial, sans-serif">
  <!-- Ямастер Чек — архитектура системы. ООО «Ямастер», ymaster.ru -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="serverbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c3d"/><stop offset="1" stop-color="#10152e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa0c9"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#0b1020" rx="14"/>
  <text x="590" y="42" text-anchor="middle" fill="#e8ecf8" font-size="24" font-weight="700">Ямастер Чек — архитектура системы</text>
  <text x="590" y="64" text-anchor="middle" fill="#6b7494" font-size="12.5">Разработчик: ООО «Ямастер» · ymaster.ru · info@ymaster.ru</text>

  <!-- Клиенты -->
  <g>
    <rect x="50" y="100" width="220" height="86" rx="12" fill="#141b36" stroke="#2b3563"/>
    <text x="160" y="134" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">📱 Мобильный клиент</text>
    <text x="160" y="156" text-anchor="middle" fill="#9aa3bd" font-size="12">PWA / камера телефона</text>
    <text x="160" y="172" text-anchor="middle" fill="#9aa3bd" font-size="12">офлайн-режим + синхронизация</text>

    <rect x="50" y="210" width="220" height="86" rx="12" fill="#141b36" stroke="#2b3563"/>
    <text x="160" y="244" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">💻 Веб-клиент</text>
    <text x="160" y="266" text-anchor="middle" fill="#9aa3bd" font-size="12">браузер ПК: камера WebRTC,</text>
    <text x="160" y="282" text-anchor="middle" fill="#9aa3bd" font-size="12">загрузка фото, дашборд</text>

    <rect x="50" y="320" width="220" height="86" rx="12" fill="#141b36" stroke="#2b3563"/>
    <text x="160" y="354" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">⌨ Ручной ввод / API</text>
    <text x="160" y="376" text-anchor="middle" fill="#9aa3bd" font-size="12">резервный ввод реквизитов,</text>
    <text x="160" y="392" text-anchor="middle" fill="#9aa3bd" font-size="12">REST для внешних систем</text>
  </g>

  <!-- Стрелки к серверу -->
  <line x1="270" y1="143" x2="360" y2="215" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="270" y1="253" x2="360" y2="253" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="270" y1="363" x2="360" y2="295" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="316" y="236" fill="#8fa0c9" font-size="11" text-anchor="middle">REST / WS</text>

  <!-- Сервер Ubuntu -->
  <rect x="365" y="90" width="470" height="430" rx="16" fill="url(#serverbg)" stroke="#3d4a7d"/>
  <rect x="365" y="90" width="470" height="42" rx="16" fill="url(#hdr)"/>
  <text x="600" y="117" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Сервер Ubuntu 24.04 — «Ямастер Чек»</text>

  <g font-size="12.5" fill="#c9d4f5">
    <rect x="390" y="152" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="490" y="178" text-anchor="middle" font-weight="700" fill="#e8ecf8">FastAPI</text>
    <text x="490" y="196" text-anchor="middle" fill="#9aa3bd">REST API · WebSocket · JWT</text>

    <rect x="610" y="152" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="710" y="178" text-anchor="middle" font-weight="700" fill="#e8ecf8">Модуль сканирования</text>
    <text x="710" y="196" text-anchor="middle" fill="#9aa3bd">OpenCV · QR 54-ФЗ · OCR-hook</text>

    <rect x="390" y="232" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="490" y="258" text-anchor="middle" font-weight="700" fill="#e8ecf8">Очередь проверки</text>
    <text x="490" y="276" text-anchor="middle" fill="#9aa3bd">фоновые задачи · кэш 30 дней</text>

    <rect x="610" y="232" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="710" y="258" text-anchor="middle" font-weight="700" fill="#e8ecf8">Модуль 1С</text>
    <text x="710" y="276" text-anchor="middle" fill="#9aa3bd">EnterpriseData · Push · маппинг</text>

    <rect x="390" y="312" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="490" y="338" text-anchor="middle" font-weight="700" fill="#e8ecf8">PostgreSQL / SQLite</text>
    <text x="490" y="356" text-anchor="middle" fill="#9aa3bd">чеки · позиции · аудит</text>

    <rect x="610" y="312" width="200" height="64" rx="10" fill="#1c2450" stroke="#455089"/>
    <text x="710" y="338" text-anchor="middle" font-weight="700" fill="#e8ecf8">Аудит и журнал ФНС</text>
    <text x="710" y="356" text-anchor="middle" fill="#9aa3bd">все действия пользователей</text>

    <rect x="390" y="400" width="420" height="52" rx="10" fill="#18203f" stroke="#455089" stroke-dasharray="5 4"/>
    <text x="600" y="422" text-anchor="middle" fill="#e8ecf8" font-weight="700">Веб-клиент SPA + PWA</text>
    <text x="600" y="440" text-anchor="middle" fill="#9aa3bd">раздаётся сервером: jsQR, камера, графики — работает офлайн</text>

    <rect x="390" y="464" width="420" height="38" rx="10" fill="#131a38" stroke="#2b3563"/>
    <text x="600" y="488" text-anchor="middle" fill="#8fa0c9">Nginx (reverse proxy, TLS 1.3) / Docker / systemd</text>
  </g>

  <!-- ФНС -->
  <rect x="900" y="140" width="230" height="96" rx="12" fill="#141b36" stroke="#2b3563"/>
  <text x="1015" y="176" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">🏛 API ФНС</text>
  <text x="1015" y="198" text-anchor="middle" fill="#9aa3bd" font-size="12">openapi.nalog.ru</text>
  <text x="1015" y="216" text-anchor="middle" fill="#9aa3bd" font-size="12">проверка ФН+ФД+ФП</text>

  <!-- 1С -->
  <rect x="900" y="330" width="230" height="140" rx="12" fill="#141b36" stroke="#2b3563"/>
  <text x="1015" y="366" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">🟡 1С:Предприятие</text>
  <text x="1015" y="390" text-anchor="middle" fill="#9aa3bd" font-size="12">БП 3.0 · ERP 2 · УТ 11</text>
  <text x="1015" y="410" text-anchor="middle" fill="#9aa3bd" font-size="12">Поступление / Авансовый отчёт</text>
  <text x="1015" y="434" text-anchor="middle" fill="#22d3ee" font-size="12">HTTP-сервис: pull + ack</text>
  <text x="1015" y="452" text-anchor="middle" fill="#22d3ee" font-size="12">дедупликация ФН+ФД+ФП</text>

  <line x1="835" y1="196" x2="900" y2="188" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="900" y1="216" x2="835" y2="226" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="868" y="176" fill="#8fa0c9" font-size="11" text-anchor="middle">HTTPS</text>

  <line x1="835" y1="392" x2="900" y2="398" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="900" y1="420" x2="835" y2="414" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="868" y="378" fill="#8fa0c9" font-size="11" text-anchor="middle">Pull (1С ←)</text>

  <text x="590" y="560" text-anchor="middle" fill="#6b7494" font-size="12">Поток данных: сканирование → разбор 54-ФЗ → дедупликация → проверка ФНС → хранение → маппинг → выгрузка в 1С</text>
  <text x="590" y="590" text-anchor="middle" fill="#4a5478" font-size="11">© ООО «Ямастер», 2026 · Ямастер Чек v1.0</text>
</svg>
