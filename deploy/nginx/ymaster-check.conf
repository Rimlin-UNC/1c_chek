# ======================================================================
# Ямастер Чек — Nginx: reverse proxy + защита (ООО «Ямастер», ymaster.ru)
#
# Слои защиты:
#   * limit_req — ограничение частоты запросов (анти-DoS);
#   * limit_conn — ограничение соединений с одного IP;
#   * запрет доступа к служебным путям (.git, data, docs, deploy);
#   * security headers; server_tokens off.
# ======================================================================

# Ограничение размера загружаемых изображений чеков
client_max_body_size 16M;
server_tokens off;

# Зоны rate-limit (анти-DoS; продублированы в приложении)
limit_req_zone $binary_remote_addr zone=ymaster_api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=ymaster_auth:10m  rate=2r/s;
limit_req_zone $binary_remote_addr zone=ymaster_static:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=ymaster_conn:10m;

# WebSocket-проксирование
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/ymaster-check.access.log;
    error_log  /var/log/nginx/ymaster-check.error.log;

    # Максимум 40 одновременных соединений с одного IP
    limit_conn ymaster_conn 40;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Закрываем служебные пути репозитория и данных
    location ~* /(\.git|data|docs|deploy|tests|integration_1c|\.env) {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Вход в систему — самый строгий лимит (анти-перебор)
    location /api/v1/auth/ {
        limit_req zone=ymaster_auth burst=6 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Основное приложение + веб-клиент
    location / {
        limit_req zone=ymaster_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Статика веб-клиента — кэш на стороне браузера
    location ~* ^/(css|js|img)/ {
        limit_req zone=ymaster_static burst=200 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # WebSocket /ws/status
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 1С: раскомментируйте и укажите свою сеть для максимальной защиты
    # location /onec/ {
    #     allow 192.168.1.0/24;   # <-- сеть сервера 1С
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
