# ======================================================================
# Ямастер Чек — Nginx (reverse proxy + SSL)
# Разработчик и владелец идеи: ООО «Ямастер» | ymaster.ru | info@ymaster.ru
#
# 1. HTTP (порт 80) — для начала работы и проверки Let's Encrypt.
# 2. После выпуска сертификата certbot сам добавит SSL-блок (443).
# ======================================================================

# Ограничение размера загружаемых изображений чеков
client_max_body_size 16M;

# WebSocket-проксирование (живые статусы)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name check.example.ru;   # <-- ЗАМЕНИТЕ на свой домен

    access_log /var/log/nginx/ymaster-check.access.log;
    error_log  /var/log/nginx/ymaster-check.error.log;

    # Основное приложение + веб-клиент
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # WebSocket /ws/status
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 1С (рекомендуется ограничить по IP корпоративной сети 1С)
    # location /onec/ {
    #     allow 192.168.1.0/24;   # <-- ваша сеть
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
