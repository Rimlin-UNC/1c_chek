# ======================================================================
# Ямастер Чек — fail2ban фильтр (ООО «Ямастер», ymaster.ru)
# Ловим в access-логе Nginx повторяющиеся 401/429 с одного IP:
# перебор паролей и упёршиеся в rate-limit — кандидаты на блокировку.
# ======================================================================
[Definition]
failregex = ^<HOST> .*"(GET|POST|PUT|PATCH|DELETE)[^"]*" (401|429) .*$
ignoreregex =
