# Ямастер Чек — ruff: статический анализ кода
# Разработчик и владелец идеи: ООО «Ямастер» | ymaster.ru | chek@ymaster.ru
# ======================================================================
# v1.70.38: линтер подключён к проекту как постоянный контроль (запуск:
# `.venv/bin/ruff check app tests` — обязан давать «All checks passed!»).
# Правила отобраны по одному признаку: ловить НАСТОЯЩИЕ дефекты, а не
# придираться к стилю, который в этом проекте сознательно другой.
#
# В gate (select) — только то, что означает ошибку, и сегодня это проходит:
#   E9            синтаксис: незакрытые скобки/отступы — падение приложения;
#   F63, F7, F82  неопределённые имена, неверные сравнения, лишний return
#                 (F821 — это NameError в рантайме, самый опасный класс);
#   W605          невалидные экранирования: с Python 3.12 SyntaxWarning,
#                 дальше — SyntaxError (3 таких места исправлены в 1.70.38);
#   B002..B033    bugbear: изменяемый аргумент по умолчанию (общее состояние
#                 между вызовами), `assert False` (исчезает под python -O),
#                 break в finally, дубли веток except, дубли в множествах;
#   PLW0120/0127/0129/0711
#                 бесполезный else, самоприсваивание, assert по литералу,
#                 неверный порядок исключений в except;
#   SIM220/SIM222 ветки, которые не выполняются НИКОГДА (`x or True`) —
#                 так в max_login.py прятался мёртвый запасной ник;
#   C416, PIE790, RUF010, RET503
#                 лишние проходы по данным, пустой pass, неявный None.
#
# СОЗНАТЕЛЬНО не включено (стиль проекта, а не дефекты):
#   UP009  — шапка «# -*- coding: utf-8 -*-» есть в каждом файле намеренно:
#            код открывают в блокноте Windows и в конфигураторе 1С;
#   B008   — Depends(...) в аргументах по умолчанию: так работает FastAPI;
#   SIM115 — open() без with: намеренно в тестах и одноразовых чтениях;
#   ARG001 — неиспользуемые аргументы: подпись задаёт фреймворк (middleware,
#            фикстуры pytest);
#   I001   — порядок импортов: в проекте историческая группировка;
#   E501   — длина строки: не контролируем, комментарии по-русски длинные.
#
# РЕЕСТР ДОЛГА: перечисленные выше классы в проекте уже есть тысячами
# (SIM115 1102, B008 412, ARG001 261, I001 193, UP009 177, F401 123,
# DTZ003 111, PLW1510 82, F841 38, S110 32, F811 21, BLE001 13, DTZ004 2).
# Списывать их разом нельзя — правка стиля в 2500 местах уронила бы рабочее
# приложение. Поэтому рост долга ЗАПРЕЩЁН тестом TestLintDebtRatchet в
# tests/test_v17038.py: число замечаний каждого класса не может стать
# больше зафиксированного. Новый код пишется чисто, старый чистится постепенно.
target-version = "py311"
line-length = 100
# app/vendor — сторонняя библиотека qrcode, проданная в репозиторий целиком:
# её стиль мы не правим (иначе обновления библиотеки станут невозможны)
extend-exclude = ["app/vendor", "data", "releases", "venv", ".venv"]

[lint]
select = [
    "E9",
    "F63", "F7", "F82",
    "W605",
    "B002", "B006", "B011", "B012", "B015", "B016", "B018", "B020",
    "B024", "B025", "B033",
    "PLW0120", "PLW0127", "PLW0129", "PLW0711",
    "SIM220", "SIM222",
    "C416", "PIE790", "RUF010", "RET503",
]
