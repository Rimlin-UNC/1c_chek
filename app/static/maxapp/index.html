<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ямастер Чек — мини-приложение</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="/maxapp/jsQR.js"></script>
<style>
:root { --bg: var(--tg-theme-bg-color, #f5f1ea); --fg: var(--tg-theme-text-color, #2b2347);
        /* v1.70.34: запасные значения — корпоративные. --accent был #e8721c
           (не фирменный #ff7a00), а белый текст на нём давал 3.06:1 — ниже
           4.5:1. Тёмный #1a1a1a на корпоративном оранжевом даёт 6.66:1.
           Значения из темы хоста (--tg-theme-*) по-прежнему в приоритете:
           это контракт Mini App, свои цвета мы ему не навязываем. */
        --accent: var(--tg-theme-button-color, #ff7a00); --accent-fg: var(--tg-theme-button-text-color, #1a1a1a);
        /* Оранжевый КАК ТЕКСТ — отдельный оттенок: один цвет не может быть и
           фоном кнопки с тёмным текстом (светлота ≥0.22), и текстом на светлом
           фоне (≤0.18). Примешиваем цвет текста темы, поэтому оттенок читается
           и в светлой, и в тёмной теме хоста: 6.80:1 на --card, 6.04:1 на --bg. */
        --accent-text: color-mix(in srgb, var(--accent) 45%, var(--fg));
        /* подсказка 13 px: #7d7693 давал 3.82:1 на --bg, стало 4.64:1 */
        --hint: var(--tg-theme-hint-color, #6f6983); --card: var(--tg-theme-secondary-bg-color, #fff); }
* { box-sizing: border-box; margin: 0; }
body { font: 16px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
       background: var(--bg); color: var(--fg); padding: 14px 14px 90px; }
h1 { font-size: 20px; margin: 4px 0 12px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.big { font-size: 34px; font-weight: 800; }
.hint { color: var(--hint); font-size: 13px; }
.btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px;
       font-size: 17px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.btn.secondary { background: transparent; color: var(--accent-text); border: 2px solid var(--accent-text); }
.btn:disabled { opacity: .5; }
input { width: 100%; border: 1px solid var(--hint); border-radius: 10px;
        padding: 12px; font-size: 16px; background: var(--bg); color: var(--fg); }
.row { display: flex; gap: 8px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
      background: var(--card); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 12px 0; font-size: 15px; color: var(--hint); }
nav button.active { color: var(--accent-text); font-weight: 700; }
.hidden { display: none; }
.rrow { display: flex; justify-content: space-between; padding: 8px 0;
        border-bottom: 1px solid var(--hint); font-size: 14px; }
.status { font-weight: 700; }
#msg { min-height: 20px; margin: 10px 0; font-weight: 600; }
code { font-size: 20px; letter-spacing: 1px; font-weight: 800; }
</style>
</head>
<body>
<div id="view-loading" class="card"><p>Подключаемся к MAX…</p></div>

<div id="view-app" class="hidden">
  <h1>Ямастер Чек</h1>

  <section id="tab-scan">
    <div class="card text-center">
      <div class="big" id="points">…</div>
      <div class="hint">моих баллов</div>
    </div>
    <button type="button" class="btn" id="btn-scan">📷 Сканировать QR чека</button>
    <div class="gap-8"></div>
    <button type="button" class="btn secondary" id="btn-cam">🎥 Камера в окне</button>
    <div class="gap-8"></div>
    <div class="card">
      <div class="hint mb-6">Или вставьте строку QR:</div>
      <input type="text" id="qr-input" placeholder="t=…&s=…&fn=…&i=…&fp=…&n=…">
      <div class="gap-8"></div>
      <button type="button" class="btn secondary" id="btn-send">Сдать чек</button>
      <div class="gap-8"></div>
      <button type="button" class="btn secondary" id="btn-photo">📷 Фото с QR-кодом</button>
      <input type="file" id="qr-file" accept="image/*" class="hidden">
    </div>
    <div id="msg"></div>
  </section>

  <section id="tab-receipts" class="hidden">
    <div class="card"><div class="hint">Последние чеки</div><div id="receipts">…</div></div>
  </section>

  <section id="tab-profile" class="hidden">
    <div class="card">
      <div class="hint">Ваш код приглашения</div>
      <code id="ref-code">—</code>
      <div class="gap-8"></div>
      <button type="button" class="btn secondary" id="btn-share">🎁 Позвать друга (+баллы)</button>
    </div>
    <div class="card hint" id="profile-extra"></div>
  </section>
</div>

<div id="view-service" class="hidden">
  <h1 id="service-title">…</h1>
  <div class="card" id="service-body"></div>
</div>

<nav>
  <button type="button" data-tab="scan" class="active">📷 Сканер</button>
  <button type="button" data-tab="receipts">🧾 Чеки</button>
  <button type="button" data-tab="profile">⭐ Профиль</button>
</nav>

<script src="/maxapp/maxapp.js?v=1.70.34"></script>
</body>
</html>
