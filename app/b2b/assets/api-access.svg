<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Segoe UI, Arial, sans-serif">
  <!-- Ямастер Чек — платное API: доступ и ключ. ООО «Ямастер», ymaster.ru -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa0c9"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#0b1020" rx="14"/>
  <rect x="0" y="0" width="1180" height="5" fill="url(#hdr)"/>
  <text x="590" y="46" text-anchor="middle" fill="#e8ecf8" font-size="24" font-weight="700">Ямастер Чек — платное API: доступ и ключ</text>
  <text x="590" y="68" text-anchor="middle" fill="#6b7494" font-size="12.5">Разработчик: ООО «Ямастер» · ymaster.ru · chek@ymaster.ru</text>

  <!-- Клиент -->
  <rect x="46" y="120" width="248" height="104" rx="12" fill="#141b36" stroke="#2b3563"/>
  <text x="170" y="152" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">🏢 Ваша система</text>
  <text x="170" y="176" text-anchor="middle" fill="#9aa3bd" font-size="12">ERP, BI, аналитика рынка,</text>
  <text x="170" y="194" text-anchor="middle" fill="#9aa3bd" font-size="12">сервис подбора чеков</text>
  <text x="170" y="212" text-anchor="middle" fill="#6b7494" font-size="11.5">любой язык и платформа: HTTPS + JSON</text>

  <!-- Ключ -->
  <rect x="46" y="264" width="248" height="120" rx="12" fill="#141b36" stroke="#ff7a00"/>
  <text x="170" y="296" text-anchor="middle" fill="#ffb066" font-size="15" font-weight="700">🔑 Ключ apk_…</text>
  <text x="170" y="320" text-anchor="middle" fill="#9aa3bd" font-size="12">выдаёт администратор,</text>
  <text x="170" y="338" text-anchor="middle" fill="#9aa3bd" font-size="12">показывается один раз</text>
  <text x="170" y="358" text-anchor="middle" fill="#9aa3bd" font-size="12">в базе — только sha256 ключа</text>
  <text x="170" y="376" text-anchor="middle" fill="#6b7494" font-size="11.5">отзыв в один приём, без остановки сервиса</text>

  <!-- Проверка доступа -->
  <rect x="382" y="120" width="416" height="264" rx="12" fill="#131a38" stroke="#2b3563"/>
  <text x="590" y="152" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">🛡 Проверка доступа на каждый запрос</text>
  <text x="404" y="182" fill="#22d3ee" font-size="12.5" font-weight="700">1</text>
  <text x="424" y="182" fill="#9aa3bd" font-size="12">API для внешних клиентов включён администратором</text>
  <text x="404" y="208" fill="#22d3ee" font-size="12.5" font-weight="700">2</text>
  <text x="424" y="208" fill="#9aa3bd" font-size="12">заголовок X-API-Key передан и не пуст</text>
  <text x="404" y="234" fill="#22d3ee" font-size="12.5" font-weight="700">3</text>
  <text x="424" y="234" fill="#9aa3bd" font-size="12">ключ найден по sha256 и не отозван</text>
  <text x="404" y="260" fill="#fbbf24" font-size="12.5" font-weight="700">4</text>
  <text x="424" y="260" fill="#9aa3bd" font-size="12">лимит тарифа: запросов за последний час</text>
  <text x="404" y="286" fill="#fbbf24" font-size="12.5" font-weight="700">5</text>
  <text x="424" y="286" fill="#9aa3bd" font-size="12">квота тарифа: запросов с начала месяца</text>
  <text x="404" y="312" fill="#34d399" font-size="12.5" font-weight="700">6</text>
  <text x="424" y="312" fill="#9aa3bd" font-size="12">запись в журнал вызовов (путь без параметров)</text>
  <line x1="404" y1="330" x2="776" y2="330" stroke="#2b3563" stroke-width="1"/>
  <text x="404" y="352" fill="#6b7494" font-size="11.5">Журнал хранится 90 дней и чистится автоматически —</text>
  <text x="404" y="370" fill="#6b7494" font-size="11.5">минимум технических данных (152-ФЗ).</text>

  <!-- Источник данных -->
  <rect x="886" y="120" width="248" height="128" rx="12" fill="#141b36" stroke="#2b3563"/>
  <text x="1010" y="152" text-anchor="middle" fill="#e8ecf8" font-size="15" font-weight="700">🧾 Чек-Пул</text>
  <text x="1010" y="176" text-anchor="middle" fill="#9aa3bd" font-size="12">чеки, подтверждённые</text>
  <text x="1010" y="194" text-anchor="middle" fill="#9aa3bd" font-size="12">официальным источником</text>
  <text x="1010" y="214" text-anchor="middle" fill="#9aa3bd" font-size="12">гео-привязка: регион и город</text>
  <text x="1010" y="234" text-anchor="middle" fill="#6b7494" font-size="11.5">отрасль определяется по категориям чека</text>

  <!-- Ответ -->
  <rect x="886" y="286" width="248" height="98" rx="12" fill="#12261f" stroke="#34d399"/>
  <text x="1010" y="316" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">✅ Ответ 200</text>
  <text x="1010" y="340" text-anchor="middle" fill="#9aa3bd" font-size="12">{"aggregated": true, …}</text>
  <text x="1010" y="360" text-anchor="middle" fill="#9aa3bd" font-size="12">счётчики, суммы, топы</text>
  <text x="1010" y="376" text-anchor="middle" fill="#6b7494" font-size="11.5">самих чеков в ответе нет</text>

  <!-- Тарифы -->
  <rect x="46" y="430" width="1088" height="146" rx="12" fill="#141b36" stroke="#2b3563"/>
  <text x="70" y="462" fill="#e8ecf8" font-size="15" font-weight="700">💼 Тариф — это лимиты ключа, которые назначает администратор</text>
  <rect x="70" y="478" width="330" height="76" rx="10" fill="#131a38" stroke="#2b3563"/>
  <text x="235" y="504" text-anchor="middle" fill="#22d3ee" font-size="13.5" font-weight="700">запросов в час</text>
  <text x="235" y="528" text-anchor="middle" fill="#9aa3bd" font-size="12">защита от пиков и «случайного» перебора</text>
  <text x="235" y="546" text-anchor="middle" fill="#6b7494" font-size="11.5">по умолчанию 60, меняется на ключ</text>
  <rect x="424" y="478" width="330" height="76" rx="10" fill="#131a38" stroke="#2b3563"/>
  <text x="589" y="504" text-anchor="middle" fill="#fbbf24" font-size="13.5" font-weight="700">квота в месяц</text>
  <text x="589" y="528" text-anchor="middle" fill="#9aa3bd" font-size="12">объём подписки на календарный месяц</text>
  <text x="589" y="546" text-anchor="middle" fill="#6b7494" font-size="11.5">по умолчанию 5 000, меняется на ключ</text>
  <rect x="778" y="478" width="332" height="76" rx="10" fill="#131a38" stroke="#2b3563"/>
  <text x="944" y="504" text-anchor="middle" fill="#ffb066" font-size="13.5" font-weight="700">стоимость</text>
  <text x="944" y="528" text-anchor="middle" fill="#9aa3bd" font-size="12">по запросу: зависит от лимитов и задач</text>
  <text x="944" y="546" text-anchor="middle" fill="#6b7494" font-size="11.5">chek@ymaster.ru · ymaster.ru</text>

  <!-- Стрелки -->
  <line x1="294" y1="172" x2="374" y2="172" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="170" y1="264" x2="170" y2="228" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="294" y1="324" x2="374" y2="324" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="334" y="164" text-anchor="middle" fill="#6b7494" font-size="11">запрос</text>
  <line x1="886" y1="184" x2="806" y2="184" stroke="#8fa0c9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="846" y="176" text-anchor="middle" fill="#6b7494" font-size="11">данные</text>
  <line x1="806" y1="335" x2="878" y2="335" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowOk)"/>
</svg>
