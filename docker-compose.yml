# ======================================================================
# Ямастер Чек — Docker Compose (production-профиль)
# Разработчик и владелец идеи: ООО «Ямастер» | ymaster.ru | info@ymaster.ru
#
# Быстрый старт:  cp .env.example .env && docker compose up -d --build
# Веб-клиент:     http://<адрес-сервера>:8000
# API-документация: http://<адрес-сервера>:8000/api/docs
# ======================================================================
services:
  app:
    build: .
    container_name: ymaster-check
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри compose используется PostgreSQL:
      DATABASE_URL: postgresql+psycopg2://ymaster:${POSTGRES_PASSWORD:-ymasterpass}@db:5432/ymaster_check
    ports:
      - "8000:8000"
    volumes:
      - app_data:/opt/ymaster-check/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    container_name: ymaster-check-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ymaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymasterpass}
      POSTGRES_DB: ymaster_check
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymaster -d ymaster_check"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  pg_data:
